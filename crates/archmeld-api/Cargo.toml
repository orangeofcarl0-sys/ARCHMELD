[package]
name = "archmeld-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ARCHMELD local HTTP API"
publish = false

[dependencies]
archmeld-core = { path = "../archmeld-core" }
axum = "0.8"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "archmeld-serve"
path = "src/main.rs"

[[bin]]
name = "archmeld-mcp"
path = "src/mcp.rs"

[[bin]]
name = "archmeld"
path = "src/cli.rs"

[lib]
name = "archmeld_api"
path = "src/lib.rs"
